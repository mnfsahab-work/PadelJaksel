name: Snapshot AYO bookings

# AYO hides a slot once it starts, so today's slots are captured every 30 min.
# Discovery and the next 3 days run every ~3 h (scripts/scrape.py decides).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto, today or full"
        default: auto

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Data lives on the `data` branch as a single commit that each run replaces,
      # so the repository does not grow with every snapshot. The first run seeds
      # it from ./data on this branch.
      - name: Load saved data
        run: |
          mkdir store
          if git fetch --depth=1 origin data; then
            git archive FETCH_HEAD | tar -x -C store
          else
            cp -r data/. store/
          fi

      - name: Scrape ayo.co.id
        env:
          DATA_DIR: store
          WORKERS: "12"
          TIME_BUDGET_MIN: "40"
          PYTHONUNBUFFERED: "1"
          MODE: ${{ github.event.inputs.mode != 'auto' && github.event.inputs.mode || '' }}
        run: python scripts/scrape.py

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="$RUNNER_TEMP/data-index"
          git -C store --git-dir="$GITHUB_WORKSPACE/.git" --work-tree=. add -A .
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "data: snapshot $(TZ=Asia/Jakarta date +'%Y-%m-%d %H:%M') WIB")
          git push -f origin "$commit:refs/heads/data"
